name: Test salons
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          SHINY: ${{ secrets.DISCORD_WEBHOOK_SHINY }}
          POKEMON_KIDS: ${{ secrets.DISCORD_WEBHOOK_POKEMON_KIDS }}
          FINGER_PUPPET: ${{ secrets.DISCORD_WEBHOOK_FINGER_PUPPET }}
          SPECIAL: ${{ secrets.DISCORD_WEBHOOK_SPECIAL }}
        run: |
          for n in SHINY POKEMON_KIDS FINGER_PUPPET SPECIAL; do
            url="${!n}"
            if [ -z "$url" ]; then echo "RESULTAT $n : secret absent"; continue; fi
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -d "{\"content\":\"✅ Test du robot : ce salon reçoit bien les annonces ($n).\"}" "$url")
            echo "RESULTAT $n : HTTP $code"
          done
