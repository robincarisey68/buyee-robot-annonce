name: Robot Buyee

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 minutes
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write             # pour enregistrer la mémoire (seen.json)

concurrency:
  group: robot-buyee
  cancel-in-progress: false

jobs:
  surveiller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Chercher les nouvelles annonces
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_SHINY: ${{ secrets.DISCORD_WEBHOOK_SHINY }}
          DISCORD_WEBHOOK_POKEMON_KIDS: ${{ secrets.DISCORD_WEBHOOK_POKEMON_KIDS }}
          DISCORD_WEBHOOK_FINGER_PUPPET: ${{ secrets.DISCORD_WEBHOOK_FINGER_PUPPET }}
          DISCORD_WEBHOOK_SPECIAL: ${{ secrets.DISCORD_WEBHOOK_SPECIAL }}
        run: python robot.py

      - name: Enregistrer la mémoire
        if: always()
        run: |
          [ -f seen.json ] || exit 0
          git config user.name "robot-buyee"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "Mémoire du robot"
          git pull --rebase -X theirs || true
          git push
